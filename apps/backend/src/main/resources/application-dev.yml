spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bazario_dev_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${DB_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    clean-disabled: ${FLYWAY_CLEAN_DISABLED:false}
    locations:
      - classpath:db/migration/catalog
      - classpath:db/migration/inventory
      - classpath:db/migration/customers
      - classpath:db/migration/orders
      - classpath:db/migration/auth
    schemas: ${FLYWAY_SCHEMAS:public}
    baseline-version: 0
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:true}
    out-of-order: ${FLYWAY_OUT_OF_ORDER:false}

  # Local Kafka (docker-compose.yaml, KRaft mode). Topic: orders.placed
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:bazario}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: true

api:
  info:
    title: Bazario API
    description: E-commerce platform API documentation (Development Environment)
    version: ${API_VERSION:1.0.0-DEV}


# Swagger Configuration
springdoc:
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH:/api-docs}
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    enabled: ${SPRINGDOC_SWAGGER_ENABLED:true}

# Actuator / Micrometer
# Metrics are exposed on dev only. Other profiles keep the Boot default (health only),
# which is what keeps /actuator/prometheus unreachable in prod.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        # Liveness must not depend on external systems: a DB outage must not restart the app.
        liveness:
          include: livenessState,ping
        # Readiness fails when a dependency is down, so traffic is routed away.
        # "kafka" joins this group once spring-kafka lands on main (see issue #34).
        readiness:
          include: readinessState,db
