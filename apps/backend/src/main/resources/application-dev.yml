spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bazario_dev_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${DB_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    clean-disabled: ${FLYWAY_CLEAN_DISABLED:false}
    locations:
      - classpath:db/migration/catalog
      - classpath:db/migration/inventory
      - classpath:db/migration/customers
      - classpath:db/migration/orders
    schemas: ${FLYWAY_SCHEMAS:public}
    baseline-version: 0
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:true}
    out-of-order: ${FLYWAY_OUT_OF_ORDER:false}

api:
  info:
    title: Bazario API
    description: E-commerce platform API documentation (Development Environment)
    version: ${API_VERSION:1.0.0-DEV}


# Swagger Configuration
springdoc:
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH:/api-docs}
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    enabled: ${SPRINGDOC_SWAGGER_ENABLED:true}